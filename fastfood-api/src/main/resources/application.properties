spring.application.name=fastfood-api

# Base de données (lancée avec docker compose à la racine du projet)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/fastfood}
spring.datasource.username=${DB_USER:fastfood}
spring.datasource.password=${DB_PASSWORD:fastfood}

# Le schéma est géré par Flyway, Hibernate se contente de le vérifier
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT : secret d'au moins 32 caractères, à remplacer en production
app.jwt.secret=${JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
app.jwt.expiration-minutes=1440

# Compte restaurateur créé au premier démarrage (développement uniquement)
app.admin.email=${ADMIN_EMAIL:resto@fastfood.local}
app.admin.password=${ADMIN_PASSWORD:resto1234}

# Origine autorisée pour le frontend React (Vite)
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}
