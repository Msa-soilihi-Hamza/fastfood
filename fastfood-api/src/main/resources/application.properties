spring.application.name=fastfood-api

# Secrets locaux : fichier .env à la racine du projet (jamais commité).
# Lancé depuis fastfood-api/, il est trouvé dans le dossier parent.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Base de données (lancée avec docker compose à la racine du projet)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/fastfood}
spring.datasource.username=${DB_USER:fastfood}
spring.datasource.password=${DB_PASSWORD:fastfood}

# Le schéma est géré par Flyway, Hibernate se contente de le vérifier
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT : secret d'au moins 32 caractères, à définir dans .env (JWT_SECRET) hors développement
app.jwt.secret=${JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
app.jwt.expiration-minutes=240

# E-mails envoyés avec Resend. Sans clé, les e-mails (et donc les codes) sont écrits dans la console.
app.mail.resend-api-key=${RESEND_API_KEY:${Resend_API_KEY:}}
app.mail.from=${MAIL_FROM:Fastfood <onboarding@resend.dev>}

# Compte restaurateur créé au premier démarrage.
# Pour recevoir ses codes de connexion, mettre une vraie adresse dans ADMIN_EMAIL.
# Sans ADMIN_PASSWORD, un mot de passe aléatoire est généré et affiché une fois dans la console.
app.admin.email=${ADMIN_EMAIL:resto@fastfood.local}
app.admin.password=${ADMIN_PASSWORD:}

# Origine autorisée pour le frontend React (Vite)
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}
